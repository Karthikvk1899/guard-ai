name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - run: ruff check src tests && ruff format --check src tests
      - run: pytest -q
      - run: python -m build
      - name: Installed wheel smoke test
        run: |
          python -m venv /tmp/wheel-test
          /tmp/wheel-test/bin/pip install dist/*.whl
          mkdir /tmp/clean-source
          printf 'import os\n' > /tmp/clean-source/example.py
          cd /tmp/clean-source
          /tmp/wheel-test/bin/guard-ai scan . --json
      - if: matrix.python == '3.13'
        run: pip-audit
  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: python
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066
