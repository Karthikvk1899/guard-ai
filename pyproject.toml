[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "guard-ai"
version = "0.2.0"
description = "Review-oriented source heuristics and optional public package availability checks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["typer>=0.16,<1", "rich>=13,<15", "httpx>=0.28,<1", "pathspec>=0.12,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2", "pip-audit>=2.9,<3"]

[project.scripts]
guard-ai = "guard_ai.cli:app"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
